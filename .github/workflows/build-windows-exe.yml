name: Build Statistical Solutions EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add SPSS SAV reader
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-input | Out-Null
          Invoke-WebRequest -Uri "https://repo.maven.apache.org/maven2/com/bedatadriven/spss/spss-reader/1.3/spss-reader-1.3.jar" -OutFile "package-input/spss-reader-1.3.jar"
          if (-not (Test-Path "package-input/spss-reader-1.3.jar")) { throw "SPSS reader dependency was not downloaded." }

      - name: Compile application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out, package-input | Out-Null
          $sources = Get-ChildItem -Path src -Recurse -Filter *.java | ForEach-Object FullName
          javac -encoding UTF-8 -Xlint:all -d out $sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse -Force assets out/assets

      - name: Run statistical smoke tests
        shell: pwsh
        run: |
          javac -encoding UTF-8 -cp out -d out SmokeTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp out SmokeTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create executable JAR
        shell: pwsh
        run: |
          jar --create --file package-input/StatisticalSolutions.jar --main-class com.candyacademia.spsslite.Main -C out .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package installable Windows application
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --name "Statistical Solutions" `
            --input package-input `
            --main-jar StatisticalSolutions.jar `
            --main-class com.candyacademia.spsslite.Main `
            --dest installer `
            --vendor "Candy Academia" `
            --description "Statistical analysis desktop software" `
            --app-version 1.1.0 `
            --icon "assets/Statistical-Solutions.ico" `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group "Statistical Solutions" `
            --win-shortcut `
            --win-per-user-install `
            --win-upgrade-uuid "8d3e59e8-8b1a-4d24-9800-e57468849378"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and name installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path installer -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Expected installer EXE was not generated." }
          Copy-Item $exe.FullName "Statistical-Solutions-Setup.exe"
          Get-Item "Statistical-Solutions-Setup.exe" | Format-List FullName, Length, LastWriteTime

      - name: Validate installer by silent installation
        shell: pwsh
        run: |
          $setup = (Resolve-Path "Statistical-Solutions-Setup.exe").Path
          $process = Start-Process -FilePath $setup -ArgumentList "/quiet" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer returned exit code $($process.ExitCode)." }
          $installed = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "Statistical Solutions.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "Silent installation completed but the application executable was not found." }
          if ($installed.Length -lt 100000) { throw "Installed application executable is unexpectedly small." }
          Write-Host "Validated installed executable: $($installed.FullName)"
          Get-FileHash "Statistical-Solutions-Setup.exe" -Algorithm SHA256 | Format-List

      - name: Create integrity checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "Statistical-Solutions-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Statistical-Solutions-Setup.exe" | Set-Content -Encoding ascii "Statistical-Solutions-Setup.exe.sha256"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Statistical-Solutions-Installer
          path: |\n            Statistical-Solutions-Setup.exe\n            Statistical-Solutions-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
